name: Check for broken links on site

on:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: true
      source_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  check-links-on-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: _site
      - name: Check links in the production artifact
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          args: >-
            --offline
            --base '${{ github.workspace }}/_site'
            --remap '^https?://diskin\.me(/[^?#]*/)([?#].*)?$ file://${{ github.workspace }}/_site${1}index.html$2'
            --remap '^https?://diskin\.me/([?#].*)?$ file://${{ github.workspace }}/_site/index.html$1'
            --remap '^https?://diskin\.me(/[^?#]*)([?#].*)?$ file://${{ github.workspace }}/_site$1$2'
            --remap '^(file://.*/)([?#].*)?$ ${1}index.html$2'
            --remap '^(file://[^?#]*/[^./?#]+)([?#].*)?$ ${1}/index.html$2'
            --verbose --no-progress '_site/**/*.html'
