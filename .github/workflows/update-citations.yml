name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
    - cron: "0 0 * * 3" # Wednesday
    - cron: "0 0 * * 5" # Friday
  workflow_dispatch:

permissions:
  contents: write
  actions: write # dispatch deploy.yml after a citation commit

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-citations.txt

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements-citations.txt

      - name: Test citation updates
        run: python -m unittest discover -s tests -p 'test_update_scholar_citations.py'

      - name: Save current citations.yml hash
        id: before
        run: |
          echo "📦 Checking existing citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_before=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_before=$sha_before" >> "$GITHUB_OUTPUT"
            echo "📝 SHA before: $sha_before"
          else
            echo "sha_before=none" >> "$GITHUB_OUTPUT"
            echo "📝 No existing citations.yml file found."
          fi

      - name: Run citation update script
        id: run_citation_update
        shell: bash
        env:
          # Keep the script's output when the timeout stops it.
          PYTHONUNBUFFERED: "1"
          # Google Scholar often blocks GitHub-hosted runners.
          # A failed fetch fails the job only when the cache last changed longer ago than this.
          MAX_CACHE_AGE_DAYS: "30"
        run: |
          set +e
          echo "🚀 Running citation update script (single attempt)..."
          start_time=$(date)
          timeout 90 python bin/update_scholar_citations.py
          status=$?
          end_time=$(date)
          set -e
          if [ "$status" -eq 0 ]; then
            echo "✅ Citation update succeeded (started at $start_time, ended at $end_time)."
            echo "✅ Citation update succeeded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "❌ Citation update script failed with exit code $status (started at $start_time, ended at $end_time)."
          if ! cache_age=$(python -c '
          import datetime, yaml
          last_updated = str(yaml.safe_load(open("_data/citations.yml"))["metadata"]["last_updated"])
          print(last_updated, (datetime.date.today() - datetime.date.fromisoformat(last_updated)).days)
          '); then
            echo "::error::Citation update failed with exit code $status, and the cache date in _data/citations.yml is unreadable."
            echo "❌ Citation update failed with exit code $status, and the cache date is unreadable." >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          read -r last_updated age_days <<< "$cache_age"
          details="the cache last changed on $last_updated, $age_days days ago (limit: $MAX_CACHE_AGE_DAYS days)"
          if [ "$age_days" -le "$MAX_CACHE_AGE_DAYS" ]; then
            echo "::warning::Citation update failed with exit code $status; keeping the cache: $details."
            echo "⚠️ Citation update failed with exit code $status; keeping the cache: $details." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Citation update failed with exit code $status, and $details."
          echo "❌ Citation update failed with exit code $status, and $details." >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Save new citations.yml hash
        id: after
        run: |
          echo "🔍 Checking updated citations.yml hash..."
          if [ -f _data/citations.yml ]; then
            sha_after=$(sha256sum _data/citations.yml | awk '{print $1}')
            echo "sha_after=$sha_after" >> "$GITHUB_OUTPUT"
            echo "📝 SHA after: $sha_after"
          else
            echo "sha_after=none" >> "$GITHUB_OUTPUT"
            echo "📝 citations.yml was not created or is missing."
          fi

      - name: Report citations.yml change in summary
        run: |
          echo "📋 Comparing citation file hashes..."
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "✅ _data/citations.yml was updated."
            echo "✅ _data/citations.yml was updated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ _data/citations.yml was not changed."
            echo "ℹ️ _data/citations.yml was not changed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          echo "🔧 Git configured."

      - name: Commit, push, and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add _data/citations.yml
          if git diff --staged --quiet; then
            echo "ℹ️ No citation changes to commit."
            exit 0
          fi
          echo "📤 Committing and pushing changes..."
          git commit -m "Update Google Scholar citations"
          git push
          # Pushes made with GITHUB_TOKEN start no push workflows; workflow_dispatch is the exception.
          gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
