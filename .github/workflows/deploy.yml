name: Deploy site

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "lighthouse_results/**"
      - "docs/**"
      - "*.md"
      - ".github/SITE_AUDIT.md"
      - ".github/MIGRATION.md"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  # Citation commits made with GITHUB_TOKEN do not trigger push workflows.
  workflow_run:
    workflows: [Update Google Scholar Citations]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          persist-credentials: false
      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Python tools
        run: python -m pip install -r requirements.txt
      - name: Check source and template contracts
        run: |
          npx prettier . --check
          python -m unittest discover -s tests -p 'test_*.py'
          bundle exec ruby tests/site_templates_test.rb
          bundle exec al-folio upgrade audit
          bundle exec al-folio upgrade overrides audit --fail-on-stale
      - name: Render the CV before building
        run: |
          rendercv render _data/cv.yml --settings assets/rendercv/settings.yaml
          rm -f assets/rendercv/rendercv_output/*.typ
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build the production artifact
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Purge unused CSS
        run: npx purgecss -c purgecss.config.js
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  accessibility:
    needs: build
    uses: ./.github/workflows/axe.yml
    with:
      artifact_name: site
      source_sha: ${{ needs.build.outputs.source_sha }}

  links:
    needs: build
    uses: ./.github/workflows/broken-links-site.yml
    with:
      artifact_name: site
      source_sha: ${{ needs.build.outputs.source_sha }}

  deploy:
    needs: [build, accessibility, links]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Publish the verified artifact
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
