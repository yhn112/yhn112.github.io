name: Axe accessibility testing

on:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        required: true
      source_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      url:
        description: "Published page path to check (empty checks the main sections)"
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: inputs.artifact_name != ''
        with:
          name: ${{ inputs.artifact_name }}
          path: _site
      - name: Set up Chrome and its matching driver
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0, packaged release
        with:
          chrome-version: stable
          install-dependencies: true
          install-chromedriver: true
      - name: Check accessibility and browser behavior
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          PAGE_PATH: ${{ inputs.url }}
        run: |
          SITE_URL=https://diskin.me
          browser_status=0
          if [ -n "$ARTIFACT_NAME" ]; then
            python3 -m http.server 8080 --protocol HTTP/1.1 --directory _site > "$RUNNER_TEMP/site-server.log" 2>&1 &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID"' EXIT
            SITE_URL=http://localhost:8080
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 "$SITE_URL/" > /dev/null
            export SITE_URL
            node tests/site-browser.mjs || browser_status=$?
          fi
          paths=("" "publications/" "cv/" "teaching/" "repositories/" "news/" "privacy/")
          if [ -n "$PAGE_PATH" ]; then
            paths=("${PAGE_PATH#/}")
          fi
          urls=()
          for path in "${paths[@]}"; do
            urls+=("$SITE_URL/$path")
          done
          npx axe --chrome-path "$CHROME_PATH" --chromedriver-path "$CHROMEDRIVER_PATH" \
            --chrome-options="--headless=new,--no-sandbox,--disable-dev-shm-usage" \
            --load-delay=1500 --exit "${urls[@]}"
          exit "$browser_status"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.artifact_name != ''
        with:
          name: site-browser-results
          path: test-results/
          if-no-files-found: warn
