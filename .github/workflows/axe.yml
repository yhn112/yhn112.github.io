name: Axe accessibility testing

on:
  workflow_run:
    workflows: ["Deploy site"]
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/)"
        required: false

env:
  URL: ""

jobs:
  check:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
      - name: Install local node tools 📦
        run: |
          mkdir -p "$RUNNER_TEMP/axe-tools"
          npm install --prefix "$RUNNER_TEMP/axe-tools" purgecss @axe-core/cli http-server
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          "$RUNNER_TEMP/axe-tools/node_modules/.bin/purgecss" -c purgecss.config.js
      - name: Get Chromium version 🌐
        # https://github.com/GoogleChromeLabs/chrome-for-testing?tab=readme-ov-file#other-api-endpoints
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "Chromium version: $CHROMIUM_VERSION"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV
      - name: Setup Chrome 🌐
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}
      - name: Install chromedriver 🚗
        run: |
          npm install --prefix "$RUNNER_TEMP/axe-tools" "chromedriver@$CHROMIUM_VERSION"
      - name: Run axe 🪓
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        run: |
          BIN_DIR="$RUNNER_TEMP/axe-tools/node_modules/.bin"
          CHROMEDRIVER_PATH="$RUNNER_TEMP/axe-tools/node_modules/chromedriver/bin/chromedriver"
          "$BIN_DIR/http-server" _site/ --port 8080 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          "$BIN_DIR/axe" --chromedriver-path "$CHROMEDRIVER_PATH" "http://localhost:8080/${{ github.event.inputs.url || env.URL }}" --load-delay=1500 --exit
