name: Axe accessibility testing

on:
  pull_request:
    branches: [main, master]
  workflow_run:
    workflows: ["Deploy site"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/)"
        required: false

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
      - name: Install local node tools 📦
        run: |
          mkdir -p "$RUNNER_TEMP/axe-tools"
          npm install --prefix "$RUNNER_TEMP/axe-tools" purgecss @axe-core/cli http-server
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          "$RUNNER_TEMP/axe-tools/node_modules/.bin/purgecss" -c purgecss.config.js
      - name: Get Chromium version 🌐
        # https://github.com/GoogleChromeLabs/chrome-for-testing?tab=readme-ov-file#other-api-endpoints
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "Chromium version: $CHROMIUM_VERSION"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"
      - name: Setup Chrome 🌐
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}
      - name: Install chromedriver 🚗
        run: |
          npm install --prefix "$RUNNER_TEMP/axe-tools" "chromedriver@$CHROMIUM_VERSION"
      - name: Run axe 🪓
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        env:
          PAGE_PATH: ${{ inputs.url }}
        run: |
          BIN_DIR="$RUNNER_TEMP/axe-tools/node_modules/.bin"
          CHROMEDRIVER_PATH="$RUNNER_TEMP/axe-tools/node_modules/chromedriver/bin/chromedriver"
          "$BIN_DIR/http-server" _site/ --port 8080 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          paths=("" "publications/" "cv/" "teaching/")
          if [ -n "$PAGE_PATH" ]; then
            paths=("${PAGE_PATH#/}")
          fi
          urls=()
          for path in "${paths[@]}"; do
            url="http://localhost:8080/$path"
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 "$url" > /dev/null
            urls+=("$url")
          done
          "$BIN_DIR/axe" --chromedriver-path "$CHROMEDRIVER_PATH" "${urls[@]}" --load-delay=1500 --exit
